<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Ironic Jewelry | Inicio</title>
</head>
<body class="bg-[#FFF2EB]"s>
    <section class="
        max-w-7xl
        mx-auto
        px-5
        sm:px-8
        lg:px-16
        py-6
    ">

        <h1 class="
            text-4xl
            py-8
            text-center
            font-semibold
        ">
            Ironic Jewelry
        </h1>

        <div class="max-w-xl mx-auto px-5 mb-8">

        <input
            id="search-input"
            type="text"
            placeholder="Buscar productos..."
            class="
                w-full
                px-5
                py-3
                rounded-lg
                border
                border-gray-300
                bg-white
                outline-none
                focus:ring-2
                focus:ring-yellow-600
        ">
        </div>

        <div class="flex flex-wrap justify-center gap-3 px-5 mb-8">

            <button
                class="category-filter px-5 py-2 rounded-full bg-black text-white"
                data-category="Todos">
                Todos
            </button>

            <button
                class="category-filter px-5 py-2 rounded-full bg-white"
                data-category="Collares">
                Collares
            </button>

            <button
                class="category-filter px-5 py-2 rounded-full bg-white"
                data-category="Pulseras">
                Pulseras
            </button>

            <button
                class="category-filter px-5 py-2 rounded-full bg-white"
                data-category="Aretes">
                Aretes
            </button>

            <button
                class="category-filter px-5 py-2 rounded-full bg-white"
                data-category="Juegos">
                Juegos
            </button>

        </div>

        <div 
            id="products-container"
            class="
                px-5
                py-4
                sm:px-8
                lg:px-12
                grid
                grid-cols-1
                sm:grid-cols-2
                md:grid-cols-3
                lg:grid-cols-4
                gap-8
        ">
        </div>

    </section>
<script src="./js/products.js"></script>
</body>
</html>
