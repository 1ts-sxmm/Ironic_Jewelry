<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Ironic Jewelry | Producto</title>
    <link
    rel="icon"
    type="image/png"
    href="./images/Ironic.jpg">
</head>

<body class="bg-[#FFF2EB]">

<div class="max-w-6xl mx-auto px-6 py-12">
    <a
        href="index.html"
        class="text-gray-600 hover:text-black">
        ← Volver al catálogo
    </a>

    <div class="grid md:grid-cols-2 gap-6 mt-8">

        <img
            id="image"
            class="w-full rounded-lg object-cover">
        <div>

            <p
                id="category"
                class="uppercase text-sm tracking-widest text-yellow-600">
            </p>

            <h1
                id="name"
                class="text-4xl font-bold mt-3">
            </h1>

            <p
                id="price"
                class="text-2xl mt-5">
            </p>

            <p
                id="material"
                class="mt-5">
            </p>

            <p
                id="description"
                class="mt-5 text-gray-700">
            </p>

            <a
                id="whatsapp-button"
                target="_blank"
                class="inline-block mt-8 px-8 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700"
            >
                Consultar por WhatsApp
            </a>
            
        </div>
    </div>
</div>
<script src="./js/product.js"></script>

</body>

</html>
